services:
  - type: web
    name: anttec-back
    runtime: docker
    repo: https://github.com/your-user/your-repo
    plan: free
    rootDir: .
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://iccontinental-lico.onrender.com
      - key: APP_URL_FRONT
        value: https://iccontinental-1-m0s1.onrender.com
      - key: APISPERU_LOOKUP_TOKEN
        sync: false
      - key: APISPERU_LOOKUP_URL
        value: https://dniruc.apisperu.com/api/v1
      - key: BILLING_PROVIDER
        value: apisperu
      - key: APISPERU_TOKEN
        sync: false
      - key: APISPERU_RUC
        sync: false
      - key: APISPERU_RAZON_SOCIAL
        sync: false
      - key: APISPERU_NOMBRE_COMERCIAL
        value: EL MUNDO DEL PERNO
      - key: APISPERU_UBIGEO
        sync: false
      - key: APISPERU_DEPARTAMENTO
        value: JUNIN
      - key: APISPERU_PROVINCIA
        value: HUANCAYO
      - key: APISPERU_DISTRITO
        value: HUANCAYO
      - key: APISPERU_DIRECCION
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_MODEL
        value: gpt-5.4-nano
      - key: MAIL_MAILER
        value: resend
      - key: RESEND_KEY
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: EL MUNDO DEL PERNO
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: public
      - key: PORT
        value: 10000
